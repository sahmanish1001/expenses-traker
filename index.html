<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kharchā — Expense Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
 
  :root{
    --bg:#12141c; --surface:#191c27; --surface2:#20232f; --border:rgba(255,255,255,.08);
    --text:#f2f0ea; --dim:#9396a8; --accent:#f2a93b; --in:#5fd1a4; --out:#ef6f6c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .kh-app{ max-width:480px; margin:0 auto; padding:20px 16px 50px; }
  .kh-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .kh-eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:0 0 2px;}
  .kh-title{font-family:'Space Grotesk',sans-serif; font-size:24px; font-weight:700; margin:0;}
  .kh-upload-btn{display:flex; align-items:center; gap:6px; background:var(--accent); color:#1a1400; border:none; border-radius:12px; padding:9px 13px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit;}
  .kh-import-card{margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; display:none;}
  .kh-import-card.open{display:block;}
  .kh-import-title{font-size:12.5px; font-weight:600; margin:0 0 4px;}
  .kh-import-help{font-size:11.5px; color:var(--dim); line-height:1.5; margin:0 0 10px;}
  .kh-import-textarea{width:100%; min-height:90px; background:var(--surface2); border:1px solid var(--border); border-radius:10px; color:var(--text); font-family:ui-monospace,monospace; font-size:11.5px; padding:10px; resize:vertical;}
  .kh-import-actions{display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;}
  .kh-btn{border:none; border-radius:10px; padding:8px 13px; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;}
  .kh-btn-primary{background:var(--accent); color:#1a1400;}
  .kh-btn-ghost{background:none; color:var(--dim); border:1px solid var(--border);}
  .kh-import-msg{font-size:11.5px; margin-top:8px;}
  .kh-import-msg.ok{color:var(--in);}
  .kh-import-msg.err{color:var(--out);}
  .kh-chips{display:flex; gap:8px; overflow-x:auto; margin-top:16px; padding-bottom:2px;}
  .kh-chip{display:flex; align-items:center; gap:6px; flex-shrink:0; padding:7px 12px; border-radius:999px; border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:500; color:var(--dim); cursor:pointer; font-family:inherit;}
  .kh-chip.active{color:#12141c; border-color:transparent;}
  .kh-chip-dot{width:7px; height:7px; border-radius:50%; display:inline-block;}
  .kh-stats{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .kh-stat{flex:1; min-width:100px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px 14px;}
  .kh-stat-head{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim);}
  .kh-stat-amt{font-family:'Space Grotesk',sans-serif; font-size:18px; font-weight:700; margin-top:6px;}
  .kh-pie-card{margin-top:16px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px;}
  .kh-pie-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:0 0 12px;}
  .kh-pie-empty{font-size:13px; color:var(--dim); padding:20px 4px; text-align:center;}
  .kh-pie-wrap{display:flex; justify-content:center;}
  .kh-pie{width:170px; height:170px; border-radius:50%; position:relative;}
  .kh-pie::after{content:""; position:absolute; inset:26px; background:var(--surface); border-radius:50%;}
  .kh-legend{margin-top:12px;}
  .kh-legend-row{display:flex; align-items:center; gap:8px; padding:6px 0;}
  .kh-legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .kh-legend-name{flex:1; font-size:12.5px;}
  .kh-legend-amt{font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600;}
  .kh-legend-pct{font-size:11px; color:var(--dim); width:34px; text-align:right;}
  .kh-section-title{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); margin:24px 0 10px; display:flex; justify-content:space-between; align-items:center;}
  .kh-section-title a{font-size:11px; color:var(--dim); cursor:pointer; text-transform:none; letter-spacing:0;}
  .kh-empty{font-size:13.5px; color:var(--dim); background:var(--surface); border:1px dashed var(--border); border-radius:14px; padding:22px 16px; text-align:center; line-height:1.5;}
  .kh-day{margin-bottom:16px;}
  .kh-day-label{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:6px;}
  .kh-day-line{flex:1; height:1px; background:repeating-linear-gradient(to right, var(--border) 0 4px, transparent 4px 8px);}
  .kh-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  .kh-row{display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px dashed var(--border);}
  .kh-row:last-child{border-bottom:none;}
  .kh-row-icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px;}
  .kh-row-mid{flex:1; min-width:0;}
  .kh-row-vendor{font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .kh-row-cat{font-size:11px; color:var(--dim); margin-top:1px;}
  .kh-row-amt{font-family:'Space Grotesk',sans-serif; font-size:13.5px; font-weight:600; flex-shrink:0;}
</style>
</head>
<body>
<div class="kh-app">
 
  <div class="kh-top">
    <div>
      <p class="kh-eyebrow">Multi-wallet tracker</p>
      <h1 class="kh-title">Kharchā</h1>
    </div>
    <button class="kh-upload-btn" onclick="toggleImport()">＋ Import statement</button>
  </div>
 
  <div class="kh-import-card" id="importCard">
    <p class="kh-import-title">Paste statement data</p>
    <p class="kh-import-help">
      Upload your statement photo to Claude in chat, copy the JSON block it sends back, and paste it below.
    </p>
    <textarea class="kh-import-textarea" id="importInput" placeholder='{"account":"eSewa","closingBalance":1200,"transactions":[...]}'></textarea>
    <div class="kh-import-actions">
      <button class="kh-btn kh-btn-primary" onclick="doImport()">Import</button>
      <button class="kh-btn kh-btn-ghost" onclick="toggleImport()">Cancel</button>
    </div>
    <div id="importMsg"></div>
  </div>
 
  <div class="kh-chips" id="chips"></div>
 
  <div class="kh-stats" id="stats"></div>
 
  <div class="kh-pie-card">
    <p class="kh-pie-title" id="pieTitle">Spending by account</p>
    <div id="pieBody"></div>
  </div>
 
  <p class="kh-section-title">Transactions <a onclick="clearImported()">Clear imported data</a></p>
  <div id="txList"></div>
 
</div>
 
<script>
  const ACCOUNTS = {
    "eSewa":       { color: "#3aa655", icon: "📱" },
    "Nabil Bank":  { color: "#e0473e", icon: "🏦" },
    "Kumari Bank": { color: "#8a1538", icon: "🏦" },
    "Khalti":      { color: "#5c2d91", icon: "👛" },
    "Other":       { color: "#9aa0ac", icon: "❔" },
  };
  const ACCOUNT_LIST = Object.keys(ACCOUNTS);
 
  const CAT = {
    "Food & Drink":     { color: "#f2a93b", icon: "☕" },
    "Groceries":        { color: "#8fd19e", icon: "🧺" },
    "Transfer In":      { color: "#5fd1a4", icon: "↙️" },
    "Transfer Out":     { color: "#ef6f6c", icon: "↗️" },
    "Bills & Payments": { color: "#7f9cf5", icon: "🧾" },
    "Wallet Top-up":    { color: "#c792ea", icon: "📱" },
    "Shopping":         { color: "#e8a87c", icon: "🛍️" },
    "Transport":        { color: "#6ec6dc", icon: "⛽" },
    "Other":            { color: "#9aa0ac", icon: "❔" },
  };
 
  // Seed data from your real Nabil Bank statement
  const SEED_TRANSACTIONS = [
    { date:"2026-08-18", vendor:"ESW Transfer", category:"Transfer In", type:"in", amount:3000, account:"Nabil Bank" },
    { date:"2026-08-18", vendor:"ESW Transfer", category:"Transfer In", type:"in", amount:1000, account:"Nabil Bank" },
    { date:"2026-08-18", vendor:"Chai Town", category:"Food & Drink", type:"out", amount:35, account:"Nabil Bank" },
    { date:"2026-08-18", vendor:"Myoseen Meat Pvt. Ltd", category:"Groceries", type:"out", amount:200, account:"Nabil Bank" },
    { date:"2026-08-19", vendor:"Shree Krishna Dairy", category:"Groceries", type:"out", amount:35, account:"Nabil Bank" },
    { date:"2026-08-19", vendor:"Rudra Karki — nasta", category:"Food & Drink", type:"out", amount:100, account:"Nabil Bank" },
    { date:"2026-08-20", vendor:"Bank Transfer", category:"Transfer In", type:"in", amount:30000, account:"Nabil Bank" },
    { date:"2026-08-20", vendor:"Bank Transfer", category:"Transfer In", type:"in", amount:24000, account:"Nabil Bank" },
    { date:"2026-08-20", vendor:"Manish Kumar", category:"Transfer Out", type:"out", amount:54000, account:"Nabil Bank" },
    { date:"2026-08-20", vendor:"Bank Transfer", category:"Transfer In", type:"in", amount:11000, account:"Nabil Bank" },
    { date:"2026-08-20", vendor:"Bank Transfer", category:"Transfer In", type:"in", amount:800, account:"Nabil Bank" },
    { date:"2026-08-21", vendor:"CIPS Payment", category:"Bills & Payments", type:"out", amount:15040, account:"Nabil Bank" },
    { date:"2026-08-23", vendor:"Liza Momo House", category:"Food & Drink", type:"out", amount:170, account:"Nabil Bank" },
    { date:"2026-08-24", vendor:"ESW Transfer", category:"Transfer In", type:"in", amount:8000, account:"Nabil Bank" },
    { date:"2026-08-24", vendor:"eSewa Load", category:"Wallet Top-up", type:"out", amount:100, account:"Nabil Bank" },
    { date:"2026-08-25", vendor:"eSewa Load", category:"Wallet Top-up", type:"out", amount:5000, account:"Nabil Bank" },
    { date:"2026-08-26", vendor:"Shiddhi Ganesh Spare Parts", category:"Shopping", type:"out", amount:850, account:"Nabil Bank" },
    { date:"2026-08-26", vendor:"eSewa Load", category:"Wallet Top-up", type:"out", amount:450, account:"Nabil Bank" },
    { date:"2026-08-26", vendor:"Valley Baba Suppliers — fuel", category:"Transport", type:"out", amount:1000, account:"Nabil Bank" },
    { date:"2026-08-26", vendor:"Narendra Chatpate Pasal", category:"Food & Drink", type:"out", amount:50, account:"Nabil Bank" },
    { date:"2026-08-27", vendor:"QR Payment", category:"Other", type:"out", amount:112, account:"Nabil Bank" },
    { date:"2026-08-27", vendor:"Binayak Tarkari Pasal", category:"Groceries", type:"out", amount:50, account:"Nabil Bank" },
    { date:"2026-08-27", vendor:"Anshila Ghimire", category:"Transfer In", type:"in", amount:5000, account:"Nabil Bank" },
  ];
  const SEED_BALANCES = { "Nabil Bank": 5608 };
 
  let activeAccount = "All";
 
  function loadImported(){
    try { return JSON.parse(localStorage.getItem("kharcha_imported") || "[]"); }
    catch(e){ return []; }
  }
  function loadBalances(){
    try { return JSON.parse(localStorage.getItem("kharcha_balances") || "{}"); }
    catch(e){ return {}; }
  }
  function saveImported(list){ localStorage.setItem("kharcha_imported", JSON.stringify(list)); }
  function saveBalances(obj){ localStorage.setItem("kharcha_balances", JSON.stringify(obj)); }
 
  function allTransactions(){ return [...SEED_TRANSACTIONS, ...loadImported()]; }
  function allBalances(){ return { ...SEED_BALANCES, ...loadBalances() }; }
 
  const rs = (n) => "Rs " + Math.round(n).toLocaleString("en-IN");
  function fmtDate(d){
    return new Date(d + "T00:00:00").toLocaleDateString("en-US", { month:"short", day:"numeric" });
  }
 
  function toggleImport(){
    document.getElementById("importCard").classList.toggle("open");
  }
 
  function doImport(){
    const raw = document.getElementById("importInput").value.trim();
    const msgEl = document.getElementById("importMsg");
    if (!raw){
      msgEl.className = "kh-import-msg err";
      msgEl.textContent = "Paste the JSON block first.";
      return;
    }
    try {
      const cleaned = raw.replace(/```json|```/g, "").trim();
      const parsed = JSON.parse(cleaned);
      const account = ACCOUNTS[parsed.account] ? parsed.account : "Other";
      const newTx = (parsed.transactions || []).map((t) => ({ ...t, account }));
      const imported = loadImported();
      saveImported([...imported, ...newTx]);
      if (parsed.closingBalance != null){
        const bal = loadBalances();
        bal[account] = parsed.closingBalance;
        saveBalances(bal);
      }
      msgEl.className = "kh-import-msg ok";
      msgEl.textContent = `Added ${newTx.length} transaction(s) to ${account}.`;
      document.getElementById("importInput").value = "";
      activeAccount = account;
      renderAll();
    } catch(e){
      msgEl.className = "kh-import-msg err";
      msgEl.textContent = "That doesn't look like valid data — make sure you copied the whole block.";
    }
  }
 
  function clearImported(){
    if (!confirm("Remove all imported statements? This keeps your original demo data.")) return;
    localStorage.removeItem("kharcha_imported");
    localStorage.removeItem("kharcha_balances");
    renderAll();
  }
 
  function renderChips(){
    const TRANSACTIONS = allTransactions();
    const el = document.getElementById("chips");
    el.innerHTML = "";
    const allBtn = document.createElement("button");
    allBtn.className = "kh-chip" + (activeAccount === "All" ? " active" : "");
    allBtn.style.background = activeAccount === "All" ? "var(--accent)" : "";
    allBtn.textContent = "All accounts";
    allBtn.onclick = () => { activeAccount = "All"; renderAll(); };
    el.appendChild(allBtn);
 
    ACCOUNT_LIST.forEach(name => {
      const meta = ACCOUNTS[name];
      const has = TRANSACTIONS.some(t => t.account === name);
      const btn = document.createElement("button");
      btn.className = "kh-chip" + (activeAccount === name ? " active" : "");
      btn.style.background = activeAccount === name ? meta.color : "";
      btn.innerHTML = `<span class="kh-chip-dot" style="background:${meta.color}; opacity:${has ? 1 : 0.35}"></span>${name}`;
      btn.onclick = () => { activeAccount = name; renderAll(); };
      el.appendChild(btn);
    });
  }
 
  function getScoped(){
    const TRANSACTIONS = allTransactions();
    return activeAccount === "All" ? TRANSACTIONS : TRANSACTIONS.filter(t => t.account === activeAccount);
  }
 
  function renderStats(){
    const scoped = getScoped();
    const totalIn = scoped.filter(t => t.type === "in").reduce((s,t)=>s+t.amount,0);
    const totalOut = scoped.filter(t => t.type === "out").reduce((s,t)=>s+t.amount,0);
    const BAL = allBalances();
    let html = `
      <div class="kh-stat"><div class="kh-stat-head">Money in</div><div class="kh-stat-amt" style="color:var(--in)">${rs(totalIn)}</div></div>
      <div class="kh-stat"><div class="kh-stat-head">Money out</div><div class="kh-stat-amt" style="color:var(--out)">${rs(totalOut)}</div></div>`;
    if (activeAccount !== "All" && BAL[activeAccount] != null){
      html += `<div class="kh-stat"><div class="kh-stat-head">Last balance</div><div class="kh-stat-amt">${rs(BAL[activeAccount])}</div></div>`;
    }
    document.getElementById("stats").innerHTML = html;
  }
 
  function renderPie(){
    const TRANSACTIONS = allTransactions();
    let data = [];
    if (activeAccount === "All"){
      document.getElementById("pieTitle").textContent = "Spending by account";
      const m = {};
      TRANSACTIONS.filter(t => t.type === "out").forEach(t => m[t.account] = (m[t.account]||0) + t.amount);
      data = Object.entries(m).map(([name,value]) => ({ name, value, color: ACCOUNTS[name]?.color || "#9aa0ac" }))
        .sort((a,b)=>b.value-a.value);
    } else {
      document.getElementById("pieTitle").textContent = "Spending by category — " + activeAccount;
      const m = {};
      getScoped().filter(t => t.type === "out").forEach(t => m[t.category] = (m[t.category]||0) + t.amount);
      data = Object.entries(m).map(([name,value]) => ({ name, value, color: CAT[name]?.color || "#9aa0ac" }))
        .sort((a,b)=>b.value-a.value);
    }
 
    const body = document.getElementById("pieBody");
    if (data.length === 0){
      body.innerHTML = `<div class="kh-pie-empty">No spending recorded here yet.</div>`;
      return;
    }
    const total = data.reduce((s,d)=>s+d.value,0) || 1;
    let angle = 0;
    const stops = data.map(d => {
      const start = angle;
      const deg = (d.value/total) * 360;
      angle += deg;
      return `${d.color} ${start}deg ${angle}deg`;
    }).join(", ");
 
    let html = `<div class="kh-pie-wrap"><div class="kh-pie" style="background:conic-gradient(${stops})"></div></div><div class="kh-legend">`;
    data.forEach(d => {
      html += `<div class="kh-legend-row">
        <span class="kh-legend-dot" style="background:${d.color}"></span>
        <span class="kh-legend-name">${d.name}</span>
        <span class="kh-legend-amt">${rs(d.value)}</span>
        <span class="kh-legend-pct">${Math.round((d.value/total)*100)}%</span>
      </div>`;
    });
    html += `</div>`;
    body.innerHTML = html;
  }
 
  function renderTx(){
    const scoped = getScoped();
    const el = document.getElementById("txList");
    if (scoped.length === 0){
      el.innerHTML = `<div class="kh-empty">No statements yet for this account.</div>`;
      return;
    }
    const groups = {};
    [...scoped].sort((a,b) => a.date < b.date ? 1 : -1).forEach(t => {
      groups[t.date] = groups[t.date] || [];
      groups[t.date].push(t);
    });
 
    let html = "";
    Object.entries(groups).forEach(([day, rows]) => {
      html += `<div class="kh-day">
        <div class="kh-day-label">${fmtDate(day)}<div class="kh-day-line"></div></div>
        <div class="kh-card">`;
      rows.forEach(t => {
        const meta = CAT[t.category] || CAT.Other;
        const sub = activeAccount === "All" ? `${t.account} · ${t.category}` : t.category;
        html += `<div class="kh-row">
          <div class="kh-row-icon" style="background:${meta.color}26">${meta.icon}</div>
          <div class="kh-row-mid">
            <div class="kh-row-vendor">${t.vendor}</div>
            <div class="kh-row-cat">${sub}</div>
          </div>
          <div class="kh-row-amt" style="color:${t.type === "in" ? "var(--in)" : "var(--out)"}">${t.type === "in" ? "+" : "−"}${rs(t.amount)}</div>
        </div>`;
      });
      html += `</div></div>`;
    });
    el.innerHTML = html;
  }
 
  function renderAll(){
    renderChips();
    renderStats();
    renderPie();
    renderTx();
  }
 
  renderAll();
</script>
</body>
</html>
